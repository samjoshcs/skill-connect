{% extends "base.html" %}
{% block title %}Sign up — SkillConnect{% endblock %}
{% block content %}

<section class="auth-page">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="auth-sub">Join for free — you'll list your skills next.</p>

    <form method="POST" class="form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">

      <button type="submit" class="btn btn-primary btn-block">Sign up</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</section>

{% endblock %}
