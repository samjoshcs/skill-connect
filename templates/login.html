{% extends "base.html" %}
{% block title %}Log in — SkillConnect{% endblock %}
{% block content %}

<section class="auth-page">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to see your matches and messages.</p>

    <a href="{{ url_for('auth.google_login') }}" class="btn-google">
      {% include "_google_icon.html" %}
      Continue with Google
    </a>

    <div class="auth-divider"><span>or use your password</span></div>

    <form method="POST" class="form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Your password" required>

      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
  </div>
</section>

{% endblock %}
